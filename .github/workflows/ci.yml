name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      ADMIN_PASSWORD: playwright-admin
      PLAYWRIGHT_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --pretty false
      - name: API E2E smoke
        run: |
          if [ -z "${TEST_DATABASE_URL:-}" ]; then
            echo "TEST_DATABASE_URL secret is not configured; skipping DB-backed Playwright smoke."
            exit 0
          fi
          npx playwright install chromium
          npx playwright test tests/e2e/admin-write/api/demo-filter.spec.ts --workers=1
